spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
spring.sleuth.enabled=false
spring.http.converters.preferred-json-mapper=jackson2
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

mosip.kernel.auditmanager-service-logs-location=logs/audit.log

spring.h2.console.enabled=true
spring.h2.console.path=/admin/h2-console/
spring.datasource.driver-class-name=org.h2.Driver
audit_database_url=jdbc:h2:mem:mosip_audit;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS AUDIT
spring.datasource.url=${audit_database_url}
audit_database_username=audituser
audit_database_password=Mosip@dev123
spring.datasource.username=${audit_database_username}
spring.datasource.password=${audit_database_password}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.datasource.testWhileIdle=true
spring.datasource.test-on-borrow=true

# Required by kernel-auth-adapter (TokenHelper / BeanConfig) when adapter is on the classpath
mosip.auth.adapter.impl.basepackage=io.mosip.kernel.auth.defaultadapter
mosip.kernel.auth.appids.realm.map={prereg:'preregistration',ida:'mosip',registrationclient:'mosip',regproc:'mosip',partner:'mosip',resident:'mosip',admin:'mosip',crereq:'mosip',creser:'mosip',datsha:'mosip'}
auth.server.validate.url=http://localhost:8091/v1/authmanager/authorize/validateToken
auth.server.admin.validate.url=http://localhost:8091/v1/authmanager/authorize/admin/validateToken
auth.server.admin.issuer.uri=http://localhost:8080/auth/realms/
auth.server.admin.allowed.audience=mosip-regproc-client,mosip-partner-client,mosip-admin-client
auth.role.prefix=ROLE_
auth.header.name=Authorization
mosip.role.auditmanager.postaudits=INDIVIDUAL,ID_AUTHENTICATION,TEST,REGISTRATION_ADMIN,REGISTRATION_SUPERVISOR,REGISTRATION_OFFICER,REGISTRATION_PROCESSOR,PRE_REGISTRATION,PRE_REGISTRATION_ADMIN,RESIDENT,ZONAL_ADMIN,GLOBAL_ADMIN
